name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: unzip -o ModTools-source.zip
      - run: mvn -B clean package
        working-directory: ModTools
      - uses: actions/upload-artifact@v4
        with:
          name: ModTools-jar
          path: ModTools/target/ModTools-1.0.0.jar
